services:
  # VÝVOJOVÁ VERZIA
  vue-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # PRODUKČNÁ VERZIA
  vue-prod:
    build:
      context: .
      target: production
    ports:
      - "8000:80"
    environment:
      - NODE_ENV=production
